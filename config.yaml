# ============================================
# 全局配置（各功能配置在 configs/ 下）
# ============================================

# ---------- LLOneBot 连接配置 ----------
llonebot:
  ws_url: "ws://127.0.0.1:3001"
  http_url: "http://127.0.0.1:3000"

# ---------- 日志配置 ----------
log:
  level: "INFO"
  file: "logs/bot.log"
  max_mb: 10
  backup_count: 5
