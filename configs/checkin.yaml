# ============================================
# 签到功能配置
# 到岗即结算: 到岗发送 "XX楼已到" 当场记时长, 无需签退
# 每人每班次每天限一次(唯一索引去重)
# ============================================

# 补签记录的时间在「班次到岗后多少分钟内」随机
makeup_window_minutes: 15

checkin_shifts:
  # 白天班次: 固定时长 duration_hours
  - name: "一班次"
    arrive: "07:40"       # 签到窗口开始
    leave: "09:20"        # 班次结束
    duration_hours: 2     # 固定录入时长(小时)
  - name: "二班次"
    arrive: "09:50"
    leave: "12:20"
    duration_hours: 3
  - name: "三班次"
    arrive: "14:10"
    leave: "15:50"
    duration_hours: 2
  - name: "四班次"
    arrive: "16:20"
    leave: "18:00"
    duration_hours: 2
  # 晚班: 时长由群友带后缀指定 options_hours, 如 "XX楼已到+2"(到21点) / "+3"(到22点)
  - name: "晚班"
    arrive: "19:20"
    leave: "22:00"
    options_hours: [2, 3]
