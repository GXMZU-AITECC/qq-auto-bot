# ============================================
# 请假功能配置
# 群友发送 "请假 班次名 [原因]" 登记
# 班次到岗前 notify_before_minutes 分钟群内提醒请假名单
# ============================================

# 功能开关：true 启用，false 关闭。
# 本仓库的示例配置显式写了 true（开箱即用）；如果删掉这一行，
# 代码读不到 enabled 就按关闭处理 —— 缺省即关闭。
enabled: true

# 提前多少分钟提醒（默认到岗前 30 分钟）
notify_before_minutes: 30

# 班次定义不在这里 —— 复用 configs/checkin.yaml 的 checkin_shifts，
# 保证请假和签到认的班次是完全同一份，改时间只改一处。
# 当前班次：一班次 07:40 / 二班次 09:50 / 三班次 14:10 / 四班次 16:20 / 晚班 19:20
